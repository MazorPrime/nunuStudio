      ctx.globalAlpha=1;
      if(live&&frac>0){
        ctx.fillStyle="rgba(5,9,10,0.8)";ctx.fillRect(cx-8,cy+9,16,2.5);
        ctx.fillStyle="#9A79C8";ctx.fillRect(cx-8,cy+9,16*frac,2.5);
      }
    } else if(t.kind==="pen"){
      const L=Math.max(0.3,lit(t.x,t.y)), occ=penOccupancy(t);
      ctx.strokeStyle=`rgba(170,140,100,${L})`;ctx.lineWidth=1.5;
      ctx.setLineDash([3,2]);
      ctx.strokeRect(cx-7,cy-7,14,14);ctx.setLineDash([]);
      ctx.fillStyle=`rgba(170,140,100,${L*0.5})`;
      for(let k=0;k<occ;k++) ctx.fillRect(cx-5+k*6,cy+3,4,3);
      if(t.mode==="breed"){ ctx.fillStyle=`rgba(124,152,98,${L})`; ctx.fillRect(cx-2,cy-6,4,4); }
    } else if(t.kind==="pensite"){
      ctx.strokeStyle="#A2957A";ctx.lineWidth=1;ctx.setLineDash([2,2]);
      ctx.strokeRect(cx-7,cy-7,14,14);ctx.setLineDash([]);
    } else if(t.kind==="study"){
      const L=Math.max(0.3,lit(t.x,t.y));
      ctx.strokeStyle=`rgba(200,180,140,${L})`;ctx.lineWidth=1.5;
      ctx.strokeRect(cx-6,cy-6,12,12);
      ctx.fillStyle=`rgba(200,180,140,${L*0.55})`;ctx.fillRect(cx-2,cy-6,4,12);
    } else if(t.kind==="bench"){
      const L=Math.max(0.3,lit(t.x,t.y));
      ctx.strokeStyle=`rgba(110,156,181,${L})`;ctx.lineWidth=1.5;
      ctx.strokeRect(cx-7,cy-5,14,10);
      ctx.fillStyle=`rgba(110,156,181,${L*0.5})`;ctx.fillRect(cx-3,cy-2,6,4);
    }
  }
  for(const it of items){
    const L=Math.max(0.25,lit(it.x,it.y));
    if(it.k==="taro"){
      ctx.fillStyle=`rgba(198,142,182,${L})`;
      ctx.beginPath();ctx.ellipse(it.x*CELL+8,it.y*CELL+9,3.2,4,0,0,7);ctx.fill();
    } else if(it.k==="book"){
      ctx.fillStyle=`rgba(206,184,142,${L})`;ctx.fillRect(it.x*CELL+4,it.y*CELL+5,8,6);
      ctx.fillStyle=`rgba(90,70,50,${L})`;ctx.fillRect(it.x*CELL+7,it.y*CELL+5,1.5,6);
    } else {
      ctx.fillStyle=it.k==="food"?`rgba(124,152,98,${L})`:it.k==="stone"?`rgba(150,160,160,${L})`:`rgba(110,156,181,${L})`;
      ctx.fillRect(it.x*CELL+5,it.y*CELL+5,6,6);
    }
  }
  for(const r of rats){
    const L=Math.max(0.3,lit(r.x,r.y)), cx=r.x*CELL+8, cy=r.y*CELL+8;
    if(r.penned){
      ctx.fillStyle=`rgba(214,164,124,${L})`;
      ctx.beginPath();ctx.arc(cx,cy-1,3.4,0,7);ctx.fill();
      ctx.fillStyle="rgba(5,9,10,0.8)";ctx.fillRect(cx-6,cy+4,12,2.5);
      ctx.fillStyle="#7C9862";ctx.fillRect(cx-6,cy+4,12*Math.min(1,r.tame/100),2.5);
      continue;
    }
    if(r.cowed){                                   // beaten: lying on its side
      ctx.strokeStyle=`rgba(196,86,47,${L*0.85})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx-5,cy+1);ctx.lineTo(cx+5,cy+1);ctx.stroke();
      const frac=Math.max(0,r.cowTimer/DEFS.rats.cowTicks);
      ctx.fillStyle="rgba(5,9,10,0.75)";ctx.fillRect(cx-5,cy-5,10,2);
      ctx.fillStyle=frac<0.3?"#C4562F":"#D9A441";ctx.fillRect(cx-5,cy-5,10*frac,2);
      continue;
    }
    const big=(r.hp||0)>DEFS.rats.hp*1.6;
    ctx.fillStyle=r.deep?`rgba(150,70,140,${L})`:`rgba(196,86,47,${L})`;
    ctx.beginPath();ctx.arc(cx,cy,big?4.6:3.5,0,7);ctx.fill();
  }
  if(dragA&&dragB){
    const {r,w,h}=rectStats(dragA,dragB);
    const cancel=tool==="cancel";
    const X=r.x0*CELL,Y=r.y0*CELL,Wp=w*CELL,Hp=h*CELL;
    const lairT=tool==="lair";
    ctx.fillStyle=cancel?"rgba(196,86,47,0.14)":lairT?"rgba(162,149,122,0.16)":"rgba(232,180,81,0.15)";
    ctx.fillRect(X,Y,Wp,Hp);
    ctx.strokeStyle=cancel?"#C4562F":lairT?"#A2957A":"#E8B451";
    ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.strokeRect(X+0.75,Y+0.75,Wp-1.5,Hp-1.5);
    ctx.setLineDash([]);
    for(const [cx0,cy0] of [[X,Y],[X+Wp,Y],[X,Y+Hp],[X+Wp,Y+Hp]]){
      ctx.fillStyle=cancel?"#C4562F":tool==="lair"?"#A2957A":"#E8B451";
      ctx.fillRect(cx0-2,cy0-2,4,4);
    }
  }

  for(const p of pawns){
    const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2;
    if(p.dead){ctx.strokeStyle="#5A3A30";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx-4,cy-4);ctx.lineTo(cx+4,cy+4);
      ctx.moveTo(cx+4,cy-4);ctx.lineTo(cx-4,cy+4);ctx.stroke();continue;}
    if(p.downed){
      ctx.strokeStyle=p.id===selId?"#E6DDC7":"#C4562F";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx-6,cy);ctx.lineTo(cx+6,cy);ctx.stroke();
      ctx.fillStyle="#8A6A55";ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fill();continue;
    }
    const worst=Math.min(p.needs.food,p.needs.rest,p.hp);
    ctx.strokeStyle=p.id===selId?"#E6DDC7":worst<25?"#C4562F":worst<50?"#D9A441":"#4E6E6A";
    ctx.lineWidth=p.id===selId?2.5:2;
    ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.stroke();
    ctx.fillStyle=p.body.some(b=>b.pros)?"#B9D4E0":spOf(p).color;
    ctx.beginPath();ctx.arc(cx,cy,3.6,0,7);ctx.fill();
    if(p.sp==="ratkin"){                            // ears, so you can tell at a glance
      ctx.fillStyle=spOf(p).color;
      ctx.beginPath();ctx.arc(cx-3.4,cy-4.6,1.7,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(cx+3.4,cy-4.6,1.7,0,7);ctx.fill();
    }
    if(armed(p)){ctx.fillStyle="#B8BEBE";ctx.fillRect(cx+4,cy-8,4,4);}
    else if(p.carry){ctx.fillStyle="#7C9862";ctx.fillRect(cx+4,cy-8,4,4);}
    if(p.carryPawnId){ctx.strokeStyle="#8A6A55";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx,cy,9,0,7);ctx.stroke();}
  }
}

/* ═══════════════════════════════════════════════════════════════
   12. UI
      The log lives entirely outside the panel rebuild, and the
      panel only touches the DOM when its contents actually change.
      That's what makes clicks land — innerHTML was previously being
      replaced between mousedown and mouseup 60 times a second.
   ═══════════════════════════════════════════════════════════════ */
let tool="dig",painting=false;
function cellFromEvent(e){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  return inB(x,y)?{x,y}:null;
}
function apply(c,isDown){
  if(!c) return;
  const i=idx(c.x,c.y);
  if(tool==="inspect"){
    if(!isDown) return;
    const p=pawns.find(p=>p.x===c.x&&p.y===c.y);
    selId = (p && p.id!==selId) ? p.id : null;    // click same pawn or empty ground to clear
    return;
  }
  if(c.x===0||c.y===0||c.x===W-1||c.y===H-1) return;
  if(tool==="dig"){if(solid[i])dig[i]=1;}
  else if(tool==="lair"){ if(!solid[i]) roomTile[i]=R_LAIR; }
  else if(tool==="cancel"){dig[i]=0; roomTile[i]=R_NONE;
    const s=things.findIndex(t=>(t.kind==="lightsite"||t.kind==="pensite")&&t.x===c.x&&t.y===c.y);
    if(s>=0) things.splice(s,1);}
  else if(tool==="pen"){
    if(!solid[i]&&!things.some(t=>t.x===c.x&&t.y===c.y))
      things.push({id:nextId++,kind:"pensite",x:c.x,y:c.y,claim:null});
  }
  else if(tool==="torch"||tool==="everlight"){
    if(tool==="everlight"&&!techs.cells) return;
    if(!solid[i]&&!things.some(t=>t.x===c.x&&t.y===c.y))
      things.push({id:nextId++,kind:"lightsite",light:tool==="everlight"?"everlight":"torch",
                   x:c.x,y:c.y,claim:null});
  }
}
/* Dig and Cancel work as a box select: press, drag out a rectangle,
   release to apply. Painting a freehand line was fiddly and easy to
   get wrong — you can see exactly what you're about to commit to,
   and back out with Esc or a right-click before releasing. Lights
   still paint, because dragging a row of torches down a corridor is
   genuinely useful. */
const RECT_TOOLS={dig:1,cancel:1,lair:1};
let dragA=null,dragB=null;
const rectOf=(a,b)=>({x0:Math.min(a.x,b.x),x1:Math.max(a.x,b.x),
                      y0:Math.min(a.y,b.y),y1:Math.max(a.y,b.y)});
function rectStats(a,b){
  const r=rectOf(a,b); let n=0;
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){
    if(x===0||y===0||x===W-1||y===H-1) continue;
    const i=idx(x,y);
    if(tool==="dig"){ if(solid[i]&&dig[i]!==1) n++; }
    else if(tool==="lair"){ if(!solid[i]&&roomTile[i]!==R_LAIR) n++; }
    else if(dig[i]||roomTile[i]||things.some(t=>t.kind==="lightsite"&&t.x===x&&t.y===y)) n++;
  }
  return {r,n,w:r.x1-r.x0+1,h:r.y1-r.y0+1};
}
function applyRect(a,b){
  const r=rectOf(a,b);
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++) apply({x,y},true);
}
function cancelDrag(){ dragA=dragB=null; }

cv.addEventListener("pointerdown",e=>{
  if(e.button===2) return;
  const c=cellFromEvent(e); if(!c) return;
  cv.setPointerCapture(e.pointerId);
  if(RECT_TOOLS[tool]){ dragA=c; dragB=c; }
  else { painting=true; apply(c,true); }
});
cv.addEventListener("pointermove",e=>{
  const c=cellFromEvent(e); if(!c) return;
  if(dragA) dragB=c;
  else if(painting) apply(c,false);
});
addEventListener("pointerup",()=>{
  if(dragA&&dragB) applyRect(dragA,dragB);
  cancelDrag(); painting=false;
});
cv.addEventListener("contextmenu",e=>{ e.preventDefault(); cancelDrag(); });
addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(dragA) cancelDrag(); else selId=null;
});

/* ── panel layout ─────────────────────────────────────────────
   Cards can be collapsed by clicking their title and reordered by
   dragging the grip. Order and collapsed state ride along in the
   save file, so a layout survives a reload. Drag is armed only from
   the grip, so buttons inside a panel still work normally. */
let collapsed={};
const sideEl=document.getElementById("side");
let dragPanel=null;

function allPanels(){ return [...document.querySelectorAll("[data-panel]")]; }
function wirePanels(){
  for(const c of allPanels()){
    if(c.dataset.wired) continue;
    c.dataset.wired="1";
    const head=c.querySelector(".card-head");
    const grip=c.querySelector(".grip");
    const chev=c.querySelector(".chev");
    const key=c.dataset.panel;

    const toggle=()=>{
      collapsed[key]=!collapsed[key];
      c.classList.toggle("collapsed",!!collapsed[key]);
      if(chev) chev.innerHTML=collapsed[key]?"&#9656;":"&#9662;";
    };
    if(chev) chev.addEventListener("click",e=>{e.stopPropagation();toggle();});
    const lbl=head&&head.querySelector(".label");
    if(lbl) lbl.addEventListener("click",toggle);

    if(grip&&c.parentElement===sideEl){
      grip.addEventListener("mousedown",()=>{c.draggable=true;});
      c.addEventListener("dragstart",()=>{dragPanel=c;c.classList.add("dragging");});
      c.addEventListener("dragend",()=>{
        dragPanel=null;c.classList.remove("dragging");c.draggable=false;
      });
      c.addEventListener("dragover",e=>{
        e.preventDefault();
        if(!dragPanel||dragPanel===c) return;
        const r=c.getBoundingClientRect();
        sideEl.insertBefore(dragPanel,(e.clientY-r.top)<r.height/2?c:c.nextSibling);
      });
    } else if(grip){
      grip.style.cursor="default";
      grip.title="This panel is fixed; the sidebar cards can be reordered.";
    }
  }
}
addEventListener("mouseup",()=>{ for(const c of allPanels()) c.draggable=false; });

function layoutState(){
  return {order:[...sideEl.children].map(c=>c.dataset.panel).filter(Boolean),collapsed};
}
function applyLayout(L){
  if(!L) return;
  if(L.order) for(const key of L.order){
    const c=sideEl.querySelector(`[data-panel="${key}"]`);
    if(c) sideEl.appendChild(c);
  }
  collapsed=Object.assign({},L.collapsed||{});
  for(const c of allPanels()){
    const on=!!collapsed[c.dataset.panel];
    c.classList.toggle("collapsed",on);
    const chev=c.querySelector(".chev");
    if(chev) chev.innerHTML=on?"&#9656;":"&#9662;";
  }
}
wirePanels();

const hintEl=document.getElementById("toolHint");
const TOOL_HINT={dig:"drag a box &middot; Esc or right-click cancels",
  lair:"drag a box over open floor &middot; one tile is one bed",
  cancel:"drag a box to clear digs and lairs",
  torch:"click or drag to place torches",
  everlight:"click or drag to place everlights",
  inspect:"click a colonist &middot; Esc clears"};
function drawHint(){
  if(dragA&&dragB){
    const {n,w,h}=rectStats(dragA,dragB);
    const verb=tool==="cancel"?"clear":tool==="lair"?"make beds in":"dig";
    hintEl.innerHTML=`<b style="color:${tool==="cancel"?"var(--rust)":"var(--amber)"}">${w}&times;${h}</b>`+
      ` &middot; ${n} tile${n===1?"":"s"} to ${verb}`;
  } else hintEl.innerHTML=TOOL_HINT[tool]||"";
}

const gridEl=document.getElementById("pgrid");
gridEl.addEventListener("click",e=>{
  const c=e.target.closest("[data-w]"); if(!c) return;
  const p=byId(pawns,+c.dataset.pw); if(!p||p.dead) return;
  const k=c.dataset.w;
  if(!canDo(p,k)) return;                 // ratkin can't be told to read
  p.prio[k]=((p.prio[k]|0)+1)%5;          // 1→2→3→4→never→1
  lastGridSig="";
});
function drawGrid(){
  const sig=pawns.map(p=>p.id+p.sp+p.dead+WORK_TYPES.map(w=>p.prio[w.key]|0).join("")).join("|");
  if(sig===lastGridSig) return;
  lastGridSig=sig;
  const head=`<tr><th style="text-align:left">Colonist</th>`+
    WORK_TYPES.map(w=>`<th>${w.name}</th>`).join("")+`</tr>`;
  const rows=pawns.map(p=>`<tr class="${p.dead?"dead":""}"><td class="nm">${p.name}`+
    (p.sp==="ratkin"?` <span style="color:var(--dim);font-size:10px">ratkin</span>`:"")+`</td>`+
    WORK_TYPES.map(w=>{
      if(!canDo(p,w.key))
        return `<td><span class="pc off" style="cursor:default;opacity:.45">·</span></td>`;
      const v=p.prio[w.key]|0;
      return `<td><button class="pc ${v?"p"+v:"off"}" data-pw="${p.id}" data-w="${w.key}">${v||"—"}</button></td>`;
    }).join("")+`</tr>`).join("");
  gridEl.innerHTML=head+rows;
}
const RES={tick:document.getElementById("rTick"),food:document.getElementById("rFood"),
           stone:document.getElementById("rStone"),crys:document.getElementById("rCrys"),
           taro:document.getElementById("rTaro"),
           book:document.getElementById("rBook"),rats:document.getElementById("rRats")};
function drawPanel(){
  RES.tick.textContent=tick; RES.food.textContent=store.food|0;
  RES.stone.textContent=store.stone|0; RES.crys.textContent=store.crystal|0;
  RES.book.textContent=store.book|0; RES.taro.textContent=store.taro|0;
  RES.rats.textContent=rats.length;

  const listSig=pawns.map(p=>`${p.id}${p.dead}${p.downed}${p.job?.type}${p.needs.food|0}${p.needs.rest|0}${p.hp|0}${p.needs.morale|0}${spOf(p).darkVision<1&&lightFrac(p.x,p.y)<0.25?"D":""}`).join("|")+"~"+selId;
  if(listSig!==lastListSig){
    lastListSig=listSig;
    pawnsEl.innerHTML=pawns.map(p=>{
      const st=p.dead?"dead":p.downed?"DOWNED":(p.job?.type||"…");
      return `<div class="pawn${p.dead?" dead":""}${p.id===selId?" sel":""}" data-p="${p.id}">
        <div class="pawn-top"><b style="color:${spOf(p).color}">${p.name}</b><span class="pawn-job${p.downed?" down":""}">${(!p.dead&&spOf(p).darkVision<1&&lightFrac(p.x,p.y)<0.25)?'<span title="working blind" style="color:var(--amber)">&#9679;</span> ':''}${st}</span></div>
        <div class="bar-row"><span>food</span>${bar(p.needs.food,col(p.needs.food))}</div>
        <div class="bar-row"><span>rest</span>${bar(p.needs.rest,col(p.needs.rest))}</div>
        <div class="bar-row"><span>hp</span>${bar(p.hp,col(p.hp))}</div>
        <div class="bar-row"><span>heart</span>${bar(p.needs.morale||0,col(p.needs.morale||0))}</div></div>`;
    }).join("");
  }

  const p=pawns.find(p=>p.id===selId);
  clearBtn.style.display=p?"":"none";
  const inspSig=p?`${p.id}${p.hp|0}${p.needs.morale|0}${p.lairTile}${(lightFrac(p.x,p.y)*20)|0}${p.body.filter(b=>b.gone).length}${p.body.filter(b=>b.pros).length}${SKILL_LIST.map(k=>lvl(p,k)).join()}${armed(p)}`:"none";
  if(inspSig!==lastInspSig){
    lastInspSig=inspSig;
    if(!p){
      inspEl.innerHTML=`<span style="color:var(--dim);font-size:11px">Pick a colonist above, or use the Inspect tool on the map. Click again or press Esc to clear.</span>`;
    } else {
      const c=caps(p),gone=p.body.filter(b=>isMissing(b)),pros=p.body.filter(b=>b.pros);
      const pips=k=>{let s="";const L=lvl(p,k);for(let i=0;i<10;i++)s+=`<span class="pip${i<L/2?" on":""}"></span>`;return s;};
      inspEl.innerHTML=
        `<div style="font-weight:600;margin-bottom:6px;color:${spOf(p).color}">${p.name}`+
        ` <span style="color:var(--dim);font-weight:400;font-size:11px">${spOf(p).name}</span>`+
        `${armed(p)?' <span style="color:var(--sand);font-weight:400">· holding a stone</span>':''}</div>`+
        SKILL_LIST.map(k=>`<div class="skill"><span>${k}</span><span><b>${lvl(p,k)}</b> ${pips(k)}</span></div>`).join("")+
        `<div style="border-top:1px solid var(--line);margin:7px 0 5px"></div>`+
        Object.entries(c).map(([k,v])=>`<div class="cap"><span>${k}</span><b style="color:${v>=0.999?"var(--sage)":v>0.6?"var(--amber)":"var(--rust)"}">${Math.round(v*100)}%</b></div>`).join("")+
        `<div class="cap"><span>bed</span><b style="color:${p.lairTile>=0?"var(--sage)":"var(--rust)"}">${p.lairTile>=0?"claimed":"none"}</b></div>`+
        `<div class="cap"><span>heart</span><b style="color:${(p.needs.morale|0)<25?"var(--rust)":"var(--sand)"}">${p.needs.morale|0}%</b></div>`+
        `<div class="cap"><span>pain</span><b style="color:${painOf(p)>0.4?"var(--rust)":"var(--sand)"}">${Math.round(painOf(p)*100)}%</b></div>`+
        `<div class="cap"><span>move speed</span><b style="color:var(--sand)">${moveSpeed(p).toFixed(2)}</b></div>`+
        `<div class="cap"><span>melee dmg</span><b style="color:var(--sand)">${meleeDmg(p).toFixed(1)}</b></div>`+
        `<div style="border-top:1px solid var(--line);margin:7px 0 5px"></div>`+
        `<div class="cap"><span>dark vision</span><b style="color:${spOf(p).darkVision>=1?"var(--sage)":"var(--sand)"}">${Math.round(spOf(p).darkVision*100)}%</b></div>`+
        `<div class="cap"><span>light here</span><b style="color:${lightFrac(p.x,p.y)>0.6?"var(--sage)":lightFrac(p.x,p.y)>0.2?"var(--amber)":"var(--rust)"}">${Math.round(lightFrac(p.x,p.y)*100)}%</b></div>`+
        ["mine","craft","study"].map(k=>{
          const m=darkMult(p,k);
          return `<div class="cap"><span>&nbsp;&nbsp;${k} here</span><b style="color:${m>0.95?"var(--sage)":m>0.7?"var(--amber)":"var(--rust)"}">${Math.round(m*100)}%</b></div>`;
        }).join("")+
        ((gone.length||pros.length)?`<div style="border-top:1px solid var(--line);margin:7px 0 5px"></div>`:"")+
        pros.map(b=>`<div class="pros">${partLabel(b)}</div>`).join("")+
        gone.map(b=>`<div class="wound">missing ${partLabel(b)}</div>`).join("")+
        (!gone.length&&!pros.length?`<div class="wound" style="color:var(--sage);margin-top:7px">unmarked</div>`:"");
    }
  }

  const active=nextBill();
  const shopSig=bills.map(b=>`${b.id}${b.recipe}${b.mode}${b.target}${b.done}${b.paused}`).join("|")
    +"~"+Object.values(store.parts).join()+"~"+(active?active.id:0);
  if(shopSig!==lastShopSig){
    lastShopSig=shopSig;
    shopEl.innerHTML = bills.length ? bills.map(b=>{
      const r=RECIPES[b.recipe], have=store.parts[b.recipe]||0;
      const cur=b.mode==="count"?b.done:have;
      const costs=Object.entries(r.cost).map(([m,n])=>`${n} ${m}`).join(", ");
      const on=active&&active.id===b.id;
      return `<div class="bill${b.paused?" paused":""}" data-b="${b.id}">
        <div class="bill-top"><b>${r.name}${on?' <span style="color:var(--amber)">&middot;</span>':''}</b>
          <span><button data-act="pause">${b.paused?"▶":"❚❚"}</button>
                <button data-act="del">✕</button></span></div>
        <div class="bill-row">
          <span class="ct">${cur}/${b.target}</span>
          <button data-act="dec">−</button><button data-act="inc">+</button>
          <button data-act="mode" style="flex:1">${b.mode==="count"?"Make X":"Do until X"}</button>
        </div>
        <div style="color:var(--dim);font-size:10px;margin-top:3px">${costs} each${have?` &middot; ${have} in store`:""}</div>
      </div>`;
    }).join("") : `<span style="color:var(--dim);font-size:11px">No bills. The bench sits idle.</span>`;
  }

  const H=heartOf(), RF=riftOf();
  const cands=riftCandidates();
  const heartSig=`${H?(H.hp|0)+H.dark:"x"}|${RF?(RF.charge/40)|0:0}|${cands.map(c=>c.sp+c.ok+c.unmet.join()).join()}|${store.food|0}`;
  if(heartSig!==lastHeartSig){
    lastHeartSig=heartSig;
    if(!H) heartEl.innerHTML=`<span style="color:var(--rust)">No Heartstone.</span>`;
    else if(H.dark){
      const can=canPay(DEFS.heart.rekindle);
      heartEl.innerHTML=
        `<div style="color:var(--rust);font-weight:600">DARK</div>`+
        `<div style="color:var(--dim);margin-top:3px">The rift is shut. Only taming will grow the hold.</div>`+
        `<div style="margin-top:6px;color:${can?"var(--amber)":"var(--dim)"}">Rekindle: ${Object.entries(DEFS.heart.rekindle).map(([k,n])=>`${n} ${k}`).join(", ")}${can?" &middot; underway":" &middot; short"}</div>`;
    } else {
      const frac=Math.round(100*H.hp/DEFS.heart.hp);
      const charge=RF?Math.round(100*Math.min(1,RF.charge/DEFS.rift.cost)):0;
      const starved=store.food<DEFS.rift.minFood;
      heartEl.innerHTML=
        `<div class="cap"><span>stone</span><b style="color:${frac<40?"var(--rust)":frac<100?"var(--amber)":"var(--sage)"}">${frac}%</b></div>`+
        `<div class="cap"><span>rift</span><b style="color:${starved?"var(--rust)":"#B79AE0"}">${starved?"needs food":charge+"%"}</b></div>`+
        `<div style="border-top:1px solid var(--line);margin:6px 0 4px"></div>`+
        cands.map(c=>
          `<div style="margin-bottom:3px">
             <span style="color:${c.ok?"var(--sage)":"var(--dim)"}">${c.ok?"&#10003;":"&#183;"} ${SPECIES[c.sp].name}</span>
             ${c.ok?"":`<div style="color:var(--dim);padding-left:12px">wants ${c.unmet.join(", ")}</div>`}
           </div>`).join("");
    }
  }

  const pens=things.filter(t=>t.kind==="pen");
  const pensSig=pens.map(p=>`${p.id}${p.mode}${penOccupancy(p)}`).join("|")+rats.filter(r=>r.penned).map(r=>r.tame|0).join(",");
  if(pensSig!==lastPensSig){
    lastPensSig=pensSig;
    pensEl.innerHTML = pens.length ? pens.map(pen=>{
      const held=rats.filter(r=>r.penned&&r.penId===pen.id);
      const breed=pen.mode==="breed";
      return `<div style="border-top:1px solid var(--line);padding:5px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:5px">
          <span style="color:var(--sand)">Pen ${pen.x},${pen.y} &middot; ${held.length}/${DEFS.rats.penCap}</span>
          <button data-pen="${pen.id}" style="padding:1px 7px;font-size:11px;color:${breed?"var(--sage)":"var(--amber)"}">${breed?"Breed":"Tame"}</button>
        </div>
        ${held.map(r=>breed
          ? `<div style="color:var(--dim)">livestock</div>`
          : `<div class="bar" style="margin-top:3px"><i style="width:${Math.min(100,r.tame)}%;background:var(--sage)"></i></div>`).join("")}
      </div>`;
    }).join("") : `<span style="color:var(--dim)">No pens. Beaten rats expire where they lie.</span>`;
  }

  const nt=nextTech();
  const studySig=`${store.book}|${Object.keys(techs).join()}|${nt}`;
  if(studySig!==lastStudySig){
    lastStudySig=studySig;
    const done=Object.keys(TECHS).filter(k=>techs[k]);
    studyEl.innerHTML=
      `<div style="color:var(--sand)">tomes in store <b style="color:${store.book?"var(--crys)":"var(--dim)"}">${store.book}</b></div>`+
      (done.length?`<div style="color:var(--crys);margin-top:5px">${done.map(k=>"✓ "+TECHS[k].name).join("<br>")}</div>`:"")+
      (nt?`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:5px">
            <span style="color:${store.book>=TECHS[nt].books?"var(--amber)":"var(--dim)"}">${TECHS[nt].name}</span>
            <div style="color:var(--dim);margin-top:2px">needs ${TECHS[nt].books} tome${TECHS[nt].books>1?"s":""}. ${TECHS[nt].blurb}</div></div>`
        :`<div style="color:var(--sage);margin-top:6px">Nothing left to learn.</div>`);
  }

  let open=0,dark=0,lowFuel=0;
  for(const t of things) if(t.kind==="light"&&t.fuel<LIGHTS[t.light].refuelAt) lowFuel++;
  for(let i=0;i<W*H;i++) if(!solid[i]){open++;if(light[i]<DEFS.light.darkBelow)dark++;}
  sysEl.innerHTML=`regions &nbsp;<b style="color:var(--bone)">${regionCount}</b><br>
    excavated &nbsp;<b style="color:var(--bone)">${open}</b><br>
    unlit &nbsp;<b style="color:${dark>open*0.5?"var(--rust)":"var(--bone)"}">${dark}</b><br>
    lights &nbsp;<b style="color:var(--bone)">${things.filter(t=>t.kind==="light").length}</b>
      ${lowFuel?`<b style="color:var(--rust)">(${lowFuel} low)</b>`:""}<br>
    beds &nbsp;<b style="color:var(--bone)">${(()=>{let n=0;for(let i=0;i<W*H;i++)if(roomTile[i]===R_LAIR)n++;return n;})()}</b>
      in <b style="color:var(--bone)">${roomsOf(R_LAIR).length}</b> lair(s)<br>
    homeless &nbsp;<b style="color:${pawns.filter(q=>!q.dead&&q.lairTile<0).length?"var(--rust)":"var(--bone)"}">${pawns.filter(q=>!q.dead&&q.lairTile<0).length}</b><br>
    ${(()=>{const blind=pawns.filter(q=>!q.dead&&spOf(q).darkVision<1&&lightFrac(q.x,q.y)<0.25).length;
      return `working blind &nbsp;<b style="color:${blind?"var(--amber)":"var(--bone)"}">${blind}</b><br>`;})()}
    deepest &nbsp;<b style="color:var(--bone)">${deepest()}</b> steps<br>
    pens &nbsp;<b style="color:var(--bone)">${things.filter(t=>t.kind==="pen").length}</b>
      ${rats.filter(r=>r.penned).length?`<b style="color:var(--sand)">(${rats.filter(r=>r.penned).length} held)</b>`:""}<br>
    cowed &nbsp;<b style="color:${rats.filter(r=>r.cowed).length?"var(--amber)":"var(--bone)"}">${rats.filter(r=>r.cowed).length}</b><br>
    seed &nbsp;<b style="color:var(--bone)">${seedText}</b>`;

  drawGrid();
  drawHint();
}

/* main loop — wrapped so a render error can never kill the sim */
const errEl=document.getElementById("err");
let errored=false;
function fail(e){
  if(errored) return; errored=true;
  errEl.style.display="block";
  errEl.textContent="Render error (sim is still running): "+(e&&e.message?e.message:e);
  console.error(e);
}
genWorld();
log("Three of you, a torch, and a great deal of rock.");
let acc=0,last=performance.now();
function frame(now){
  try{
    acc+=now-last;last=now;
    if(speed>0){let g=0;while(acc>=DEFS.tickMs&&g<30){acc-=DEFS.tickMs;for(let i=0;i<speed;i++)step();g++;}}
    else acc=0;
    draw();drawPanel();
  }catch(e){ fail(e); }
  requestAnimationFrame(frame);          // ← always re-registers, no matter what
}
requestAnimationFrame(frame);
</script>
</body>
</html>
